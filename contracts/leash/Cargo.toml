[package]
name = "airkey-leash"
version = "0.1.0"
edition = "2021"
description = "AirKey leash: spending rules for AI agents on NEAR"
license = "MIT"
repository = "https://github.com/airkey/airkey"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.6"

[dev-dependencies]
near-sdk = { version = "5.6", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
